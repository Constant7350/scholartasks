name: College data

# Refreshes supabase/seed/colleges.json from the U.S. Department of Education's
# College Scorecard. Run by hand (Actions > College data > Run workflow, on a
# branch, each fall when new data is out). Needs the SCORECARD_API_KEY secret
# (free from https://api.data.gov/signup/).
# The result is committed back to the branch it ran on, for review in a pull request.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "colleges = school facts and prices; programs = majors at each school; faith = religious affiliation; both = all three"
        type: choice
        options: [both, colleges, programs, faith]
        default: both

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: inputs.what == 'colleges' || inputs.what == 'both'
        run: node scripts/colleges/fetch.mjs
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      - if: inputs.what == 'programs' || inputs.what == 'both'
        run: node scripts/colleges/fetch-programs.mjs
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      - if: inputs.what != 'programs'
        run: node scripts/colleges/fetch-faith.mjs
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed/colleges.json supabase/seed/college_programs.json supabase/seed/college_faith.json 2>/dev/null || git add supabase/seed/colleges.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh college data from College Scorecard (${{ inputs.what }})"
          git push
