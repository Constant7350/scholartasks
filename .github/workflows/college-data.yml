name: College data

# Refreshes supabase/seed/colleges.json from the U.S. Department of Education's
# College Scorecard. Runs when the fetch script changes on a branch, by hand
# (Actions > College data > Run workflow, on a branch, each fall when new data is out).
# The result is committed back to the branch it ran on, for review in a pull request.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [scripts/colleges/fetch.mjs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/colleges/fetch.mjs
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed/colleges.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh college data from College Scorecard"
          git push
