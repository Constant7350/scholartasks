name: Phone app - iPhone build

# Builds the iPhone app on GitHub's Mac computers and sends it to TestFlight.
# Start it from the Actions tab: "Phone app - iPhone build" -> Run workflow.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID   Apple Developer team ID (10 characters)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      the whole text of the AuthKey_XXXX.p8 file (Admin role)
# Signing is handled by Apple (cloud-managed certificates), so no certificate files are stored here.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Send the build to TestFlight"
        type: boolean
        default: true

concurrency: { group: mobile-ios, cancel-in-progress: false }

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing repository secret $v. See setup/phone-app-and-domain-setup.md"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: App Store Connect key
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Missing repository secret ASC_KEY_P8"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Build number
        working-directory: apps/mobile
        run: |
          node -e 'const f="app.json",j=require("./"+f);j.expo.ios.buildNumber=String(process.env.GITHUB_RUN_NUMBER);require("fs").writeFileSync(f,JSON.stringify(j,null,2))'
      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace ScholarTasks.xcworkspace -scheme ScholarTasks -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/ScholarTasks.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 200
      - name: Export (and send to TestFlight)
        run: |
          set -o pipefail
          DEST=${{ inputs.upload && 'upload' || 'export' }}
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ScholarTasks.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 100
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with: { name: ScholarTasks-ios, path: "${{ runner.temp }}/export/*.ipa", retention-days: 7 }
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect
